<div class="container"
    fxLayout="row"
    fxLayout.sm="column"
    fxLayout.xs="column"
    fxLayoutAlign.gt-md="space-around center"
    fxLayoutGap="10px" 
    fxLayoutGap.xs="0">

  <mat-grid-list cols="2" rowHeight="400px">  
        <div fxFlex *ngIf="dish" >
            <mat-card>
              <mat-card-header>
                <mat-card-title>
                  <h3>{{dish.name | uppercase}}</h3>
                </mat-card-title>
              </mat-card-header>
              <img mat-card-img src="{{dish.image}}" alt="{{dish.name}}">
              <mat-card-content>
                <p>{{dish.description}}</p>
              </mat-card-content>
              <mat-card-actions>
                <button mat-button>LIKE</button>
                <button mat-button>SHARE</button>
              </mat-card-actions>
            </mat-card>
        </div>
  
        <div fxFlex *ngIf="dish">
            <mat-list fxFlex>
                <h3>Comments</h3>
                <mat-list-item *ngFor="let comment of dish.comments">
                  <p mat-line><span>{{comment.comment}} </span></p>
                  <p mat-line>
                    <span> {{comment.rating}} Stars </span>
                  </p>
                  <p mat-line>
                    <span> -- {{comment.author}}  {{comment.date | date}} </span>
                  </p>
                </mat-list-item>
              </mat-list>
        </div>
</mat-grid-list>
  
</div>
